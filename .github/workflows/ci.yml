name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check Go formatting
        run: |
          files="$(git ls-files '*.go')"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo "These Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --enable-only=govet,staticcheck --timeout=5m

  helm:
    name: Helm chart checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4
      - name: Run Helm render regression tests
        run: python3 -B -m unittest discover -s test/helm -v
      - name: Lint chart with strict warnings
        run: helm lint --strict ./deployment/helm --set slack.existingSecret=ci-placeholder
      - name: Render chart without a cluster
        run: helm template ci ./deployment/helm --set slack.existingSecret=ci-placeholder

  release-snapshot:
    name: Stable release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - uses: docker/setup-buildx-action@v3
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release artifacts and multi-architecture snapshot
        shell: bash
        run: |
          set +e
          goreleaser release --snapshot --clean --debug > "$RUNNER_TEMP/goreleaser.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/goreleaser.log"
          if (( status != 0 )); then
            summary="$(tail -n 30 "$RUNNER_TEMP/goreleaser.log" | tr '\n' ' ')"
            printf '::error title=GoReleaser snapshot failed::%s\n' "$summary"
            exit "$status"
          fi

  govulncheck:
    name: Go dependency vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Scan Go packages with govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
