version: 2

project_name: k8s-diff-informer

env:
  - GO111MODULE=on
  - CGO_ENABLED=0

# Only build for beta releases
before:
  hooks:
    - go mod tidy

# Minimal build configuration for Docker
builds:
  - id: k8s-diff-informer
    main: ./cmd/k8s-diff-informer
    binary: k8s-diff-informer
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser

# Skip archives - we only want Docker images
# archives:
#   - format: binary
#     name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

# Docker configuration for beta releases only
dockers:
  - image_templates:
      - "ghcr.io/mina-maher/{{ .ProjectName }}:{{ .Version }}-amd64"
      - "ghcr.io/mina-maher/{{ .ProjectName }}:beta-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.prerelease=true"
      - "--platform=linux/amd64"
    goos: linux
    goarch: amd64

  - image_templates:
      - "ghcr.io/mina-maher/{{ .ProjectName }}:{{ .Version }}-arm64"
      - "ghcr.io/mina-maher/{{ .ProjectName }}:beta-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.prerelease=true"
      - "--platform=linux/arm64"
    goos: linux
    goarch: arm64

# Docker manifests for multi-arch support
docker_manifests:
  - name_template: "ghcr.io/mina-maher/{{ .ProjectName }}:{{ .Version }}"
    image_templates:
      - "ghcr.io/mina-maher/{{ .ProjectName }}:{{ .Version }}-amd64"
      - "ghcr.io/mina-maher/{{ .ProjectName }}:{{ .Version }}-arm64"

  - name_template: "ghcr.io/mina-maher/{{ .ProjectName }}:beta"
    image_templates:
      - "ghcr.io/mina-maher/{{ .ProjectName }}:beta-amd64"
      - "ghcr.io/mina-maher/{{ .ProjectName }}:beta-arm64"

# Skip package managers
nfpms:
  - # This is intentionally empty to skip nfpm
    formats: []
    skip: true

# Skip checksum file
checksum:
  disable: true

# Skip changelog in release
changelog:
  disable: true

# Configure release for beta only
release:
  disable: false
  draft: false
  prerelease: true  # Always mark as prerelease for beta
  mode: replace
  
  # Only process beta tags
  name_template: "{{.ProjectName}} {{.Version}} (Beta)"
  
  header: |
    ## 🧪 Beta Release - Docker Images Only
    
    ⚠️ **This is a beta release for testing purposes only**
    
    ### Docker Pull Commands
    
    ```bash
    # Specific beta version (multi-arch)
    docker pull ghcr.io/mina-maher/k8s-diff-informer:{{.Version}}
    
    # Latest beta (multi-arch)
    docker pull ghcr.io/mina-maher/k8s-diff-informer:beta
    ```
    
    ### Available Tags
    - `{{.Version}}` - This specific beta version
    - `beta` - Latest beta release (updated with each beta)
    
    ### Supported Architectures
    - `linux/amd64` (x86_64)
    - `linux/arm64` (ARM 64-bit)
    
    ### Testing Notes
    - Not recommended for production use
    - Please report issues: https://github.com/MIna-Maher/k8s-diff-informer/issues
    - Feedback welcome in discussions
  
  footer: |
    ---
    **Full Changelog**: https://github.com/MIna-Maher/k8s-diff-informer/compare/{{.PreviousTag}}...{{.Tag}}

# Skip other features