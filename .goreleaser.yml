version: 2

project_name: k8s-diff-informer

builds:
  - id: k8s-diff-informer
    main: ./cmd/k8s-diff-informer
    binary: k8s-diff-informer
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.FullCommit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser

archives:
  - id: binaries
    ids: [k8s-diff-informer]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

before:
  hooks:
    - ./scripts/package-chart.sh

dockers_v2:
  - id: k8s-diff-informer
    ids: [k8s-diff-informer]
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/mina-maher/k8s-diff-informer
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Kubernetes resource change notifications for Slack"
      org.opencontainers.image.source: "https://github.com/MIna-Maher/k8s-diff-informer"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: MIT

release:
  github:
    owner: MIna-Maher
    name: k8s-diff-informer
  draft: false
  prerelease: "false"
  name_template: "{{ .ProjectName }} {{ .Version }}"
  header: |
    Stable release of k8s-diff-informer.

    Container image: `ghcr.io/mina-maher/k8s-diff-informer:{{ .Version }}`
    Supported platforms: Linux amd64 and arm64.
  footer: |
    Install the matching Helm chart from `k8s-diff-informer-{{ .Version }}.tgz`.

    See [CHANGELOG.md](https://github.com/MIna-Maher/k8s-diff-informer/blob/{{ .Tag }}/CHANGELOG.md)
    and the [installation guide](https://github.com/MIna-Maher/k8s-diff-informer/blob/{{ .Tag }}/deployment/helm/README.md).
  extra_files:
    - glob: ./.release-artifacts/k8s-diff-informer-*.tgz
    - glob: ./CHANGELOG.md

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
