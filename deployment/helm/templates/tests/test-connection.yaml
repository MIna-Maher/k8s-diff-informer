{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "k8s-diff-informer.fullname" . }}-test-connection"
  labels:
    {{- include "k8s-diff-informer.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: readiness
      image: busybox:1.37.0
      command: ['wget']
      args:
        - '--spider'
        - '--timeout=10'
        - 'http://{{ include "k8s-diff-informer.fullname" . }}-metrics:{{ .Values.metrics.service.port }}/ready'
{{- end }}
