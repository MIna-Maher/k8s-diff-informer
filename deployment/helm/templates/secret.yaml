{{- if not .Values.slack.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-diff-informer.slackSecretName" . }}
  labels:
    {{- include "k8s-diff-informer.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.slack.existingSecretKey | quote }}: {{ required "Set slack.webhookUrl or slack.existingSecret" (.Values.slack.webhookUrl | trim) | b64enc | quote }}
{{- end }}
