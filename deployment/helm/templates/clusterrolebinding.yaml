---
# templates/clusterrolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-diff-informer.fullname" . }}
  labels:
    {{- include "k8s-diff-informer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-diff-informer.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "k8s-diff-informer.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}

---