# templates/clusterrole.yaml - COMPLETE CORRECTED VERSION
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-diff-informer.fullname" . }}
  labels:
    {{- include "k8s-diff-informer.labels" . | nindent 4 }}
rules:
  # Allow get, list, watch on ALL resources in ALL API groups
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Allow API discovery (needed for dynamic informer/resource detection)
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*"]
    verbs: ["get"]