# values.yaml
# Default values for k8s-diff-informer
replicaCount: 1

image:
  repository:  ghcr.io/mina-maher/k8s-diff-informer
  pullPolicy: IfNotPresent
  tag: "beta"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

# Slack configuration
slack:
  # The webhook URL will be stored in a Kubernetes secret
  # Set this during installation: --set slack.webhookUrl="your-webhook-url"
  webhookUrl: ""
  # Alternatively, you can reference an existing secret
  existingSecret: ""
  existingSecretKey: "webhook-url"

# Application configuration
config:
  clusterName: "kubernetes-cluster"
  watchedResources:
    - "deployments"
    - "services"
    - "configmaps"
    - "clusterroles"
    - "namespaces"
  watchedNamespaces:
    - "default"
    - "kube-system"
  fieldsToRemove:
    - ""
    - "data.status"
    - "status"
    - "metadata.creationTimestamp"
    - "metadata.uid"
    - "metadata.resourceVersion"
    - "metadata.selfLink"
    - "metadata.managedFields"
    - "metadata.generation"
    - "metadata.finalizers"
    - "metadata.annotations"
    - "metadata.ownerReferences"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
    - ALL

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Liveness and readiness probes
livenessProbe:
  enabled: false
  # httpGet:
  #   path: /healthz
  #   port: http
  # initialDelaySeconds: 30
  # periodSeconds: 10

readinessProbe:
  enabled: false
  # httpGet:
  #   path: /ready
  #   port: http
  # initialDelaySeconds: 5
  # periodSeconds: 5

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Additional volumes and volume mounts
volumes: []
volumeMounts: []

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Network Policy
networkPolicy:
  enabled: false
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 443  # HTTPS for Slack webhook
        - protocol: TCP
          port: 6443  # Kubernetes API server

# Monitoring
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    labels: {}
    interval: 30s
    path: /metrics

# Additional pod annotations
podAnnotations: {}

# Additional pod labels
podLabels: {}
