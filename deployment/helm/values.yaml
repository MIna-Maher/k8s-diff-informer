# values.yaml
# Default values for k8s-diff-informer

# ⚠️ IMPORTANT: Due to in-memory queue design, replicaCount must be 1
# Scaling to multiple replicas will cause duplicate notifications
replicaCount: 1

image:
  repository: ghcr.io/mina-maher/k8s-diff-informer
  pullPolicy: Always
  tag: "beta"

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

# Slack configuration
slack:
  # The webhook URL will be stored in a Kubernetes secret
  # Set this during installation: --set slack.webhookUrl="your-webhook-url"
  webhookUrl: ""
  # Alternatively, you can reference an existing secret
  existingSecret: ""
  existingSecretKey: "webhook-url"

# Application configuration
config:
  clusterName: "kubernetes-cluster"
  watchedResources:
    - "deployments"
    - "services"
    - "configmaps"
    - "clusterroles"
    - "namespaces"
  watchedNamespaces:
    - "default"
    - "kube-system"
  fieldsToRemove:
    - ""
    - "data.status"
    - "status"
    - "metadata.creationTimestamp"
    - "metadata.uid"
    - "metadata.resourceVersion"
    - "metadata.selfLink"
    - "metadata.managedFields"
    - "metadata.generation"
    - "metadata.finalizers"
    - "metadata.annotations"
    - "metadata.ownerReferences"

# Queue configuration
queue:
  # Enable async queue processing (recommended for production)
  enabled: true
  # Number of worker goroutines
  workers: 10
  # Queue buffer size (max pending tasks)
  size: 1000

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Liveness and readiness probes
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

# Metrics configuration
metrics:
  # Enable Prometheus metrics
  enabled: true
  # Port for metrics server
  port: 8080
  
  # Service configuration for metrics
  service:
    type: ClusterIP
    port: 8080
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: "/metrics"

  # ServiceMonitor configuration for Prometheus Operator
  serviceMonitor:
    enabled: true
    # Namespace where ServiceMonitor should be created (if different from release namespace)
    namespace: ""
    # Additional labels for ServiceMonitor
    labels:
      release: prometheus-operator
    # Scrape interval
    interval: 30s
    # Scrape timeout
    scrapeTimeout: 10s
    # Metrics path
    path: /metrics
    # Honor labels
    honorLabels: false
    # Target labels to be added to scraped metrics
    targetLabels: []
    # Metric relabelings
    metricRelabelings: []
    # Relabelings
    relabelings: []
    # Namespace selector
    namespaceSelector: {}

    # PrometheusRule configuration for alerting
  prometheusRule:
      enabled: true
      # Namespace where PrometheusRule should be created (if different from release namespace)
      namespace: ""
      # Additional labels for PrometheusRule
      labels:
        release: prometheus-operator

# Additional volumes and volume mounts
volumes: []
volumeMounts: []

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Network Policy
networkPolicy:
  enabled: false
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 443  # HTTPS for Slack webhook
        - protocol: TCP
          port: 6443  # Kubernetes API server

# Additional pod annotations
podAnnotations: {}

# Additional pod labels
podLabels: {}