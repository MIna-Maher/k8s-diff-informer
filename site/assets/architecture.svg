<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">k8s-diff-informer data flow</title>
  <desc id="desc">Kubernetes objects flow through dynamic informers, configured field removal and diff computation, an in-memory notification queue, and Slack. Prometheus scrapes metrics from the application.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43}
      .label{font-size:19px;font-weight:650}.detail{font-size:14px;fill:#486581}
      .node{stroke-width:2}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="330" rx="18" fill="#f8fafc"/>
  <text x="38" y="42" font-size="14" font-weight="700" letter-spacing="1.4" fill="#486581">EVENT FLOW</text>
  <rect class="node" x="35" y="100" width="190" height="94" rx="14" fill="#e0f2fe" stroke="#38a3d1"/>
  <text class="label" x="130" y="139" text-anchor="middle">Kubernetes API</text>
  <text class="detail" x="130" y="165" text-anchor="middle">watched resources</text>
  <path class="line" d="M225 147H266"/>
  <rect class="node" x="275" y="100" width="190" height="94" rx="14" fill="#ede9fe" stroke="#8b7ad9"/>
  <text class="label" x="370" y="139" text-anchor="middle">Dynamic informers</text>
  <text class="detail" x="370" y="165" text-anchor="middle">list, watch, filter</text>
  <path class="line" d="M465 147H506"/>
  <rect class="node" x="515" y="100" width="200" height="94" rx="14" fill="#fef3c7" stroke="#e3aa29"/>
  <text class="label" x="615" y="139" text-anchor="middle">Field filtering</text>
  <text class="detail" x="615" y="165" text-anchor="middle">compute meaningful diffs</text>
  <path class="line" d="M715 147H756"/>
  <rect class="node" x="765" y="100" width="180" height="94" rx="14" fill="#dcfce7" stroke="#48a36a"/>
  <text class="label" x="855" y="139" text-anchor="middle">Memory queue</text>
  <text class="detail" x="855" y="165" text-anchor="middle">workers and retries</text>
  <path class="line" d="M945 147H986"/>
  <rect class="node" x="995" y="100" width="170" height="94" rx="14" fill="#fce7f3" stroke="#cf6da4"/>
  <text class="label" x="1080" y="139" text-anchor="middle">Slack</text>
  <text class="detail" x="1080" y="165" text-anchor="middle">webhook notification</text>
  <path d="M855 194V255H615V205" class="line"/>
  <rect x="478" y="252" width="274" height="52" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text class="label" x="615" y="284" text-anchor="middle">Prometheus metrics</text>
</svg>